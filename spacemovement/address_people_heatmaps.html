// 监听图例切换事件，动态调整 visualMap 的颜色与最大值范围
chart.on('legendselectchanged', function (obj) {
    let activeMetric = '';
    for (let key in obj.selected) {
        if (obj.selected[key]) {
            activeMetric = key;
            break;
        }
    }
    if (!activeMetric) return;

    const targetConfig = payload[
        activeMetric === '观察人数' ? 'observation' :
        activeMetric === '光顾人数' ? 'patronage' :
        activeMetric === '打卡人数' ? 'checkin' :
        activeMetric === '社交人数' ? 'social' :
        activeMetric === '饮食人数' ? 'dining' : 'resting'
    ];
    const targetColors = colorThemes[activeMetric];

    chart.setOption({
        visualMap: {
            max: targetConfig.visualMax,
            inRange: {
                color: targetColors
            },
            controller: {
                inRange: {
                    color: targetColors
                }
            }
        }
    });
});

chart.setOption(option);

window.addEventListener("resize", function () {
    chart.resize();
});
</script>
