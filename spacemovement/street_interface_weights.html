<!DOCTYPE html>
<html lang="zh-CN" style="height: 100%">
<head>
  <meta charset="utf-8">
  <title>巨富长街区各街道界面评价权重与构成差异分析</title>
  <!-- 引入 ECharts 5 CDN -->
  <script src="https://fastly.jsdelivr.net/npm/echarts@5/dist/echarts.min.js"></script>
  <link rel="stylesheet" href="chart-theme.css">
  <script src="monochrome.js"></script>
</head>
<body style="height: 100%; margin: 0; background-color: #f8fafc;">
  <div id="container" style="height: 100%; width: 100%;"></div>

  <script type="text/javascript">
    const resData = {"roads": ["建国西路", "武康路", "陕西南路", "汾阳路", "复兴中路", "乌鲁木齐中路", "永康路", "永嘉路", "绍兴路", "华亭路", "襄阳北路", "五原路", "太原路", "嘉善路", "襄阳南路", "南昌路", "茂名南路", "延庆路", "安福路", "新乐路", "富民路", "巨鹿路", "东湖路", "长乐路"], "series": {"界面开放度": [0.43, 0.93, 2.0, 1.58, 2.0, 2.82, 2.4, 2.5, 3.25, 3.0, 2.0, 3.56, 2.72, 3.89, 3.06, 2.25, 4.0, 3.66, 3.5, 3.33, 3.28, 3.4, 4.25, 2.83], "临界互动性": [0.57, 0.93, 2.0, 2.0, 2.5, 3.0, 3.0, 2.62, 3.25, 4.0, 2.0, 2.44, 2.75, 4.11, 3.23, 4.0, 3.0, 3.36, 3.33, 3.42, 3.84, 3.8, 4.0, 3.5], "视觉丰富度": [0.57, 0.71, 0.5, 2.0, 0.5, 3.09, 3.0, 3.12, 2.5, 3.0, 5.0, 3.33, 3.33, 2.78, 3.03, 4.0, 3.0, 3.2, 3.5, 4.17, 3.46, 3.8, 4.25, 3.83], "历史感知度": [0.71, 0.57, 0.5, 2.0, 1.5, 1.73, 2.2, 3.25, 2.25, 2.0, 1.0, 1.89, 3.53, 2.44, 3.01, 3.75, 1.0, 3.04, 2.83, 2.42, 3.32, 3.8, 4.0, 4.0], "遮阴率": [0.0, 0.64, 2.0, 0.0, 1.75, 1.23, 2.0, 0.0, 0.0, 1.5, 2.5, 2.5, 0.83, 0.75, 1.82, 0.0, 3.75, 2.8, 2.33, 2.67, 2.8, 3.9, 1.75, 5.0], "路面状态": [0.71, 0.93, 1.5, 2.42, 2.5, 2.73, 3.0, 4.12, 4.5, 3.0, 4.0, 3.33, 4.0, 3.56, 3.53, 4.0, 4.5, 3.6, 4.33, 3.92, 3.36, 4.0, 4.5, 3.67]}};

    const dom = document.getElementById('container');
    const myChart = echarts.init(dom);

    // 采用 test1.py 同款莫兰迪调配色系
    const colors = ['#8EA89D', '#D4A373', '#D4A5A5', '#8EAA90', '#B5838D', '#6D8299'];
    const categories = ['界面开放度', '临界互动性', '视觉丰富度', '历史感知度', '遮阴率', '路面状态'];

    // 参照 bar-y-category-stack.html 结构构建堆叠系列，并加入透明度样式
    const seriesList = categories.map((name, idx) => ({
      name: name,
      type: 'bar',
      stack: 'total', // 开启横向堆叠
      label: {
        show: true,
        fontSize: 11,
        color: '#ffffff',
        formatter: function (params) {
          return params.value > 0.4 ? params.value.toFixed(1) : '';
        }
      },
      emphasis: { focus: 'series' },
      itemStyle: { 
        color: colors[idx],
        opacity: 0.6 
      },
      data: resData.series[name]
    }));

    const option = {
      title: {
        text: '巨富长街区 - 不同街道节点界面评价权重与构成差异分析',
        subtext: '界面整体状态由六项维度加权决定（各项满分5分，遮阴率已等比换算为5分制，悬浮可查看具体权重占比）',
        left: 'center',
        top: '20px',
        textStyle: { fontSize: 18, fontWeight: 'bold', color: '#1e293b' },
        subtextStyle: { fontSize: 12, color: '#64748b' }
      },
      tooltip: {
        trigger: 'axis',
        axisPointer: { type: 'shadow' },
        formatter: function (params) {
          let total = params.reduce((sum, p) => sum + p.value, 0);
          let html = `<div style="font-weight:bold;margin-bottom:6px;border-bottom:1px solid #eee;padding-bottom:4px;">${params[0].name}</div>`;
          html += `<div style="font-size:12px;color:#64748b;margin-bottom:6px;">综合评估加权总分: <b style="color:#0f172a">${total.toFixed(2)}</b> / 30 分</div>`;
          params.forEach(p => {
            let percent = total > 0 ? ((p.value / total) * 100).toFixed(1) : '0.0';
            html += `<div style="display:flex;justify-content:space-between;align-items:center;gap:15px;margin:3px 0;font-size:12px;">
              <span>${p.marker} ${p.seriesName}</span>
              <span style="font-weight:bold;">${p.value.toFixed(2)} 分 <span style="color:#64748b;font-weight:normal;">(权重 ${percent}%)</span></span>
            </div>`;
          });
          return html;
        }
      },
      legend: {
        top: '65px',
        data: categories,
        textStyle: { color: '#334155' }
      },
      grid: {
        left: '3%',
        right: '4%',
        bottom: '3%',
        top: '110px',
        containLabel: true
      },
      xAxis: {
        type: 'value',
        name: '加权综合得分 (满分30分)',
        nameLocation: 'middle',
        nameGap: 30,
        splitLine: { lineStyle: { type: 'dashed', color: '#cbd5e1' } }
      },
      yAxis: {
        type: 'category',
        data: resData.roads,
        axisLabel: { fontSize: 12, color: '#334155' }
      },
      series: seriesList
    };

    myChart.setOption(option);
    window.addEventListener('resize', () => myChart.resize());
  </script>
</body>
</html>
