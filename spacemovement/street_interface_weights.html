<!DOCTYPE html>
<html lang="zh-CN" style="height: 100%">
<head>
  <meta charset="utf-8">
  <title>衡复风貌区各街道界面评价权重与构成差异分析</title>
  <!-- 引入 ECharts 5 CDN -->
  <script src="echarts.min.js"></script>
  <meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="studies.css"><script src="survey-data.js"></script>
  <script src="monochrome.js"></script>
</head>
<body data-study="2">
  <header><a href="../visualizations.html" aria-label="返回图表目录">←</a><h1>02 街道空间评分因素权重分析</h1><span class="meta"></span></header><p class="note">各街道有效评分均值，遮荫率换算为5分制，占比为六项均值构成比例，六项评分合计30分</p><div id="container" style="flex:1;min-height:0;width:100%"></div>

  <script type="text/javascript">
    const resData = {"roads": ["东湖路", "乌鲁木齐中路", "五原路", "华亭路", "南昌路", "嘉善路", "复兴中路", "太原路", "安福路", "宝庆路", "富民路", "巨鹿路", "延庆路", "建国西路", "新乐路", "武康路", "永嘉路", "永康路", "汾阳路", "绍兴路", "茂名南路", "襄阳北路", "襄阳南路", "长乐路", "陕西南路"], "series": {"界面开放度": [4.25, 4.0, 4.1111, 3.0, 2.25, 3.8889, 4.0, 2.9286, 3.5, 4.0, 3.28, 3.4, 3.66, 3.6333, 3.3333, 3.8462, 2.8571, 3.75, 3.11, 3.25, 4.0, 2.0, 3.3263, 2.8333, 3.0], "临街互动性": [4.0, 4.1818, 3.0, 4.0, 4.0, 4.1111, 5.0, 3.1071, 3.3333, 3.0, 3.84, 3.8, 3.36, 3.6667, 3.4167, 3.2308, 3.0, 4.5, 3.6667, 3.25, 3.0, 2.0, 3.4958, 3.5, 3.0], "视觉丰富度": [4.25, 4.2727, 4.0, 3.0, 4.0, 2.7778, 1.0, 3.7143, 3.5, 3.0, 3.46, 3.8, 3.2, 3.8333, 4.1667, 3.8462, 3.5714, 4.75, 3.3333, 2.5, 3.0, 5.0, 3.0868, 3.8333, 2.5], "历史感知度": [4.0, 2.0909, 2.75, 2.0, 3.75, 2.4444, 3.0, 3.9643, 2.8333, 2.0, 3.32, 3.8, 3.04, 4.0, 2.4167, 2.5385, 3.7143, 3.25, 3.6667, 2.25, 1.0, 1.0, 3.1679, 4.0, 2.5], "遮阴率": [1.75, 2.1818, 3.8571, 1.5, 2.0, 3.1944, 3.5, 3.0, 2.3333, 3.0, 2.8, 3.9, 2.8, 3.4167, 2.6667, 3.3542, 3.9167, 3.375, 3.8333, 2.5, 3.75, 2.5, 3.5526, 5.0, 4.25], "路面状态": [4.5, 4.0, 4.375, 3.0, 4.0, 3.5556, 5.0, 4.7143, 4.3333, 5.0, 3.36, 4.0, 3.6, 4.3333, 3.9167, 4.8462, 4.7143, 5.0, 4.5567, 4.5, 4.5, 4.0, 3.6921, 3.6667, 4.0]}};

    document.querySelector('.meta').textContent='2026人因空间·'+window.SURVEY.rows.length+'RECORDS';
    const dom = document.getElementById('container');
    const myChart = echarts.init(dom);

    // 采用 test1.py 同款莫兰迪调配色系
    const colors = ['#8EA89D', '#D4A373', '#D4A5A5', '#8EAA90', '#B5838D', '#6D8299'];
    const categories = ['界面开放度', '临街互动性', '视觉丰富度', '历史感知度', '遮阴率', '路面状态'];

    // 参照 bar-y-category-stack.html 结构构建堆叠系列，并加入透明度样式
    const seriesList = categories.map((name, idx) => ({
      name: name,
      type: 'bar',
      stack: 'total', // 开启横向堆叠
      label: {
        show: true,
        fontSize: 11,
        color: '#ffffff',
        formatter: function (params) {
          return params.value > 0.4 ? params.value.toFixed(1) : '';
        }
      },
      emphasis: { focus: 'series' },
      itemStyle: {
        color: colors[idx],
        opacity: 0.6
      },
      data: resData.series[name]
    }));

    const option = {

      tooltip: {
        trigger: 'axis',
        axisPointer: { type: 'shadow' },
        formatter: function (params) {
          let total = params.reduce((sum, p) => sum + p.value, 0);
          let html = `<div style="font-weight:bold;margin-bottom:6px;border-bottom:1px solid #eee;padding-bottom:4px;">${params[0].name}</div>`;
          html += `<div style="font-size:12px;color:#64748b;margin-bottom:6px;">六项评分均值合计: <b style="color:#0f172a">${total.toFixed(2)}</b> / 30 分</div>`;
          params.forEach(p => {
            let percent = total > 0 ? ((p.value / total) * 100).toFixed(1) : '0.0';
            html += `<div style="display:flex;justify-content:space-between;align-items:center;gap:15px;margin:3px 0;font-size:12px;">
              <span>${p.marker} ${p.seriesName}</span>
              <span style="font-weight:bold;">${p.value == null ? '缺失' : p.value.toFixed(2)} 分 <span style="color:#64748b;font-weight:normal;">(权重 ${percent}%)</span></span>
            </div>`;
          });
          return html;
        }
      },
      legend: {
        top: '8px',
        data: categories,
        textStyle: { color: '#334155' }
      },
      grid: {
        left: '3%',
        right: '4%',
        bottom: '3%',
        top: '45px',
        containLabel: true
      },
      xAxis: {
        type: 'value',
        name: '',
        nameLocation: 'middle',
        nameGap: 30,
        splitLine: { lineStyle: { type: 'dashed', color: '#cbd5e1' } }
      },
      yAxis: {
        type: 'category',
        data: resData.roads,
        axisLabel: { fontSize: 12, color: '#334155' }
      },
      series: seriesList
    };

    myChart.setOption(option);
    window.addEventListener('resize', () => myChart.resize());
  </script>
</body>
</html>
